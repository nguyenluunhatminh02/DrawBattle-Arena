name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drawbattle
          POSTGRES_PASSWORD: drawbattle
          POSTGRES_DB: drawbattle
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U drawbattle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @drawbattle/shared build

      - name: Generate Prisma client
        run: pnpm --filter @drawbattle/api exec prisma generate

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://drawbattle:drawbattle@localhost:5440/drawbattle?schema=public
        run: pnpm --filter @drawbattle/api exec prisma migrate deploy

      # Integration tests create challenges, which require at least one word.
      - name: Seed database
        env:
          DATABASE_URL: postgresql://drawbattle:drawbattle@localhost:5440/drawbattle?schema=public
        run: pnpm --filter @drawbattle/api db:seed

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm --filter @drawbattle/api test

      # TEST-01..TEST-14: DB-backed regressions run against the PostgreSQL and
      # Redis services declared on this job. Prisma migrations are applied above.
      - name: Integration tests (PostgreSQL + Redis)
        env:
          DATABASE_URL: postgresql://drawbattle:drawbattle@localhost:5440/drawbattle?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-with-at-least-32-chars
        run: pnpm --filter @drawbattle/api test:integration

      - name: Clean DB migration check
        env:
          DATABASE_URL: postgresql://drawbattle:drawbattle@localhost:5440/drawbattle?schema=public
        run: |
          # A second migrate deploy on an already-migrated DB must be a no-op.
          pnpm --filter @drawbattle/api exec prisma migrate deploy
          pnpm --filter @drawbattle/api exec prisma migrate status

      - name: Build API
        run: pnpm --filter @drawbattle/api build

      - name: Build Web
        run: pnpm --filter @drawbattle/web build

      - name: Install Playwright browsers
        run: pnpm --filter @drawbattle/web exec playwright install --with-deps chromium

      - name: Start API for e2e
        env:
          DATABASE_URL: postgresql://drawbattle:drawbattle@localhost:5440/drawbattle?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-with-at-least-32-chars
          CORS_ORIGIN: http://localhost:3002
          PORT: 3001
          # E2E tests use X-Forwarded-For to give each client its own throttle
          # bucket. The API ignores forwarded headers by default (production
          # stays at 0); only this local CI process trusts the one proxy hop.
          TRUST_PROXY: 1
        run: |
          pnpm --filter @drawbattle/api start > /tmp/drawbattle-api.log 2>&1 &
          echo $! > /tmp/drawbattle-api.pid

      - name: Start Web for e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          INTERNAL_API_URL: http://localhost:3001
          PORT: 3002
        run: |
          cd apps/web
          pnpm start > /tmp/drawbattle-web.log 2>&1 &
          echo $! > /tmp/drawbattle-web.pid

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/api/flags >/dev/null && curl -sf http://localhost:3002 >/dev/null; then
              echo "Services ready"
              exit 0
            fi
            sleep 2
          done
          echo "Services failed to start"
          cat /tmp/drawbattle-api.log
          cat /tmp/drawbattle-web.log
          exit 1

      # E2E-01..E2E-10: browser and HTTP contract regressions.
      - name: Playwright e2e tests
        env:
          DATABASE_URL: postgresql://drawbattle:drawbattle@localhost:5440/drawbattle?schema=public
        run: pnpm --filter @drawbattle/web test:e2e

      # Same checks as the post-deploy smoke test, against the CI-deployed app.
      - name: Post-deploy smoke / health check
        env:
          SMOKE_API_URL: http://localhost:3001
          SMOKE_WEB_URL: http://localhost:3002
        run: ./scripts/smoke-test.sh

      - name: Stop e2e services
        if: always()
        run: |
          if [ -f /tmp/drawbattle-api.pid ]; then kill $(cat /tmp/drawbattle-api.pid) 2>/dev/null || true; fi
          if [ -f /tmp/drawbattle-web.pid ]; then kill $(cat /tmp/drawbattle-web.pid) 2>/dev/null || true; fi
