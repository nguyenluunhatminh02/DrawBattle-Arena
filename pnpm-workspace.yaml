packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  # @nestjs/platform-express 10.x pins multer 2.0.2; force the patched line
  # without a framework major upgrade. multer 2.x keeps the same API.
  multer: 2.5.0

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - bcrypt
  - esbuild
  - '@nestjs/core'
  - canvas
  - protobufjs
  - sharp
  - msgpackr-extract
  - '@swc/core'
  - node-pty
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  canvas: true
  esbuild: true
  prisma: true
