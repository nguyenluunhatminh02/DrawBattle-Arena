packages:
  - 'apps/*'
  - 'packages/*'

# Overrides live in package.json: pnpm 9 (used by CI) only reads pnpm.overrides
# there. Keeping a duplicate block here would be ignored and misleading.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - bcrypt
  - esbuild
  - '@nestjs/core'
  - canvas
  - protobufjs
  - sharp
  - msgpackr-extract
  - '@swc/core'
  - node-pty
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  canvas: true
  esbuild: true
  prisma: true
