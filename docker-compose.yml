services:
  postgres:
    image: postgres:16-alpine
    container_name: drawbattle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: drawbattle
      POSTGRES_PASSWORD: drawbattle
      POSTGRES_DB: drawbattle
    ports:
      # Default credentials: bind to loopback only. Override the host address
      # (e.g. 0.0.0.0:5440:5432) only on a trusted, firewalled network.
      - '127.0.0.1:5440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drawbattle']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drawbattle-redis
    restart: unless-stopped
    ports:
      # Host port 6380 is taken by other services on some hosts; use a distinct
      # port. Redis has no password by default, so keep the bind on loopback.
      - '127.0.0.1:6390:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
    container_name: drawbattle-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://drawbattle:drawbattle@postgres:5432/drawbattle?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required - generate with openssl rand -hex 32}
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      # Production-safe placeholder (no localhost fallback); override with the
      # public site URL for staging/development, e.g. CORS_ORIGIN=http://localhost:3002.
      CORS_ORIGIN: ${CORS_ORIGIN:-https://drawbattle.caphesuachua.blog}
      # Do not trust X-Forwarded-For by default. Set explicitly to the number
      # of trusted proxy hops (or a CIDR) in environments that terminate TLS in
      # front of the API. This prevents direct callers from splitting throttle buckets.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      NODE_ENV: production
    ports:
      - '3001:3001'
    volumes:
      # Public assets (avatars) stay on this volume. Replay GIFs are private and
      # use a separate persistent volume outside the statically served tree so
      # they survive container recreation without becoming web-accessible.
      - media_data:/app/apps/api/public
      - replay_data:/app/apps/api/private-replays
    healthcheck:
      # /api/flags is an unauthenticated GET; it confirms the HTTP process
      # answers, not that Prisma/Redis are healthy. Node 20 has global fetch;
      # the API image (Debian slim) has no wget/curl.
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3001/api/flags')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      network: host
      args:
        # Empty by default: the browser uses same-origin URLs and Next.js
        # rewrites proxy /api/* and /game/* to the API container.
        # Override only when the API is served from a different public origin.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3001}
    container_name: drawbattle-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3001}
      PORT: 3002
    ports:
      - '3002:3002'
    healthcheck:
      # Liveness only: Next.js serves the landing page even if its API proxy
      # target is down.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3002/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  media_data:
  # Private, persistent replay GIF storage. Not mounted under `public` and not
  # exposed by any web rewrite: only /api/replays/file/:id.gif can stream it.
  replay_data:
