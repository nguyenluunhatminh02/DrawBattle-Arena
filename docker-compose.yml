services:
  postgres:
    image: postgres:16-alpine
    container_name: drawbattle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: drawbattle
      POSTGRES_PASSWORD: drawbattle
      POSTGRES_DB: drawbattle
    ports:
      - '5440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drawbattle']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drawbattle-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: drawbattle-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://drawbattle:drawbattle@postgres:5432/drawbattle?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required - generate with openssl rand -hex 32}
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3002}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      NODE_ENV: production
    ports:
      - '3001:3001'
    volumes:
      - media_data:/app/apps/api/public

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        INTERNAL_API_URL: http://api:3001
    container_name: drawbattle-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      INTERNAL_API_URL: http://api:3001
      PORT: 3002
    ports:
      - '3002:3002'

volumes:
  pgdata:
  redisdata:
  media_data:
