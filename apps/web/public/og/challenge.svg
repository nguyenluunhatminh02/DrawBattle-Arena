<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <g opacity="0.2" fill="#ffffff">
    <circle cx="100" cy="80" r="6"/>
    <circle cx="200" cy="150" r="4"/>
    <circle cx="1100" cy="100" r="8"/>
    <circle cx="1050" cy="200" r="5"/>
    <circle cx="150" cy="550" r="7"/>
    <circle cx="1000" cy="500" r="6"/>
  </g>

  <!-- Canvas area -->
  <rect x="80" y="140" width="700" height="438" rx="24" fill="url(#canvas)" filter="url(#shadow)"/>

  <!-- Sample drawing (pencil strokes) -->
  <g stroke="#1f2937" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 200 400 Q 250 350 300 380 Q 350 410 400 370 Q 450 330 500 380 Q 550 430 600 390"/>
    <circle cx="350" cy="300" r="50"/>
    <path d="M 350 250 L 350 220 M 350 380 L 350 410"/>
    <path d="M 280 300 L 250 300 M 420 300 L 450 300"/>
  </g>

  <!-- Title -->
  <text x="830" y="200" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff">DrawBattle</text>

  <!-- Subtitle -->
  <text x="830" y="260" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="#e0e7ff">Arena</text>

  <!-- Question -->
  <text x="830" y="360" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Bạn đoán được không?</text>

  <!-- CTA button -->
  <rect x="830" y="410" width="300" height="70" rx="35" fill="#ffffff"/>
  <text x="980" y="457" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#8b5cf6" text-anchor="middle">▶ Chơi ngay</text>

  <!-- Footer -->
  <text x="830" y="540" font-family="system-ui, sans-serif" font-size="22" fill="#c7d2fe">Vẽ nhanh • Đoán nhanh • Cười cùng bạn bè</text>

  <!-- Small badge -->
  <rect x="80" y="80" width="180" height="40" rx="20" fill="rgba(255,255,255,0.2)"/>
  <text x="170" y="108" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">🎨 Challenge</text>
</svg>
